  about:
    enable: true
    title: "About Me"
    image: "/images/me-thw.png"
    content: |-
      By day, I'm a researcher in Medical Informatics at the University of Luebeck, Germany. 
      I work with a passion towards better semantic interoperability in German healthcare systems 
      within the [Medical Informatics Initiative](https://www.medizininformatik-initiative.de/en/start) and
      [Network University Medicine](https://www.netzwerk-universitaetsmedizin.de/en/about-us/network-of-university-medicine)
      through the [SU-TermServ project](https://mii-termserv.de/en) and am responsible for the central
      FHIR 🔥 terminology server of the MII. 

      By night, I volunteer in the [German Federal Agency for Technical Relief](https://www.thw.de), the German civil defense agency.

