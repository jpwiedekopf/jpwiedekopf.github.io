        info:
          enable: false
        content: "I'm currently working in the SU-TermServ project and am the chief maintainer of the central FHIR terminology server for the Medical Informatics Initiative."
      - job: "Volunteer in Civil Defense"
        id: "thw-luebeck-2021"
        company: "German Federal Agency for Technical Relief (THW), Ortsverband Luebeck, Germany"
        date: "September 2021 - present"
        companyUrl: "https://www.thw.de/EN"
        info:
          enable: false
        content: "I am active in the German Federal Agency for Technical Relief (Technisches Hilfswerk, THW), the German federal civil defense and disaster relief agency. The THW is entirely volunteer-based. I am currently a platoon leader (Truppführer) in a *Fachgruppe Ortung*, which is responsible for locating missing persons especially in collapsed structure."
  
